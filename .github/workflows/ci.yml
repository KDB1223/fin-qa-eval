name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest
      - name: Validate and QC the shipped eval set
        run: |
          fin-qa-eval validate
          fin-qa-eval qc
      - name: Grade the fixture predictions
        run: fin-qa-eval grade --pred examples/predictions.jsonl
      - name: Planted bad samples must fail QC
        run: |
          set +e
          fin-qa-eval qc --data data/fixtures/bad_samples.jsonl
          code=$?
          set -e
          test "$code" -eq 1
